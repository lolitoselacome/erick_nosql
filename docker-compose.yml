# =====================================================================
# CETIA NoSQL - Entorno local
#
# Cuatro servicios, en el orden en que se hablan:
#
#   portal (5173)  y  admin (5174)   el navegador
#          |                  |
#          +--------+---------+
#                   v
#              api (8000)      Django: sesion, rol y frontera
#                   v
#              datos (4000)    Node: la unica puerta a MongoDB
#                   v
#              MongoDB Atlas   en la nube
#
# La base no esta aqui: vive en Atlas. Lo que se levanta en local son
# las tres capas de la aplicacion.
#
#   docker compose up -d --build
# =====================================================================

services:
  # -------------------------------------------------------------------
  # La capa de datos. Es la unica que tiene la cadena de conexion de
  # MongoDB: ni la API ni el frontend la conocen.
  # -------------------------------------------------------------------
  datos:
    build:
      context: ./datos
    container_name: cetia_datos
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_BASE: ${MONGODB_BASE:-cetia}
      PUERTO_CAPA_DATOS: 4000
      SECRETO_CAPA_DATOS: ${SECRETO_CAPA_DATOS:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # La API. No habla con MongoDB: todo se lo pide a datos.
  # -------------------------------------------------------------------
  api:
    build:
      context: ./backend
    container_name: cetia_api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_HOSTS: localhost,127.0.0.1,api
      URL_CAPA_DATOS: http://datos:4000
      SECRETO_CAPA_DATOS: ${SECRETO_CAPA_DATOS:-}
      ORIGENES_PERMITIDOS: http://localhost:5173,http://localhost:5174
      MINUTOS_DE_SESION: ${MINUTOS_DE_SESION:-10}
    ports:
      - "8000:8000"
    depends_on:
      datos:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------
  # El portal publico: alumnos y docentes.
  # -------------------------------------------------------------------
  portal:
    build:
      context: ./frontend
      args:
        APLICACION: portal
    container_name: cetia_portal
    environment:
      VITE_URL_API: http://localhost:8000
      VITE_APLICACION: portal
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # -------------------------------------------------------------------
  # El panel administrativo: administracion y coordinacion. Es otra
  # aplicacion, en otra direccion, y nunca se enlaza desde el portal.
  # -------------------------------------------------------------------
  admin:
    build:
      context: ./frontend
      args:
        APLICACION: admin
    container_name: cetia_admin
    environment:
      VITE_URL_API: http://localhost:8000
      VITE_APLICACION: admin
    ports:
      - "5174:5173"
    depends_on:
      - api
    restart: unless-stopped
